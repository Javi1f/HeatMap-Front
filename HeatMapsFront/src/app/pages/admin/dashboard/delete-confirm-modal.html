<div class="modal-overlay" (click)="cancel.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-icon-wrap">
      <span class="material-icons modal-icon-warn">warning_amber</span>
    </div>
    <h3>¿Eliminar correo?</h3>
    <p>
      El correo <strong>{{ email?.email }}</strong> ya no podrá
      usarse para registrarse como administrador.
    </p>
    <div class="modal-actions">
      <button class="btn-secondary" (click)="cancel.emit()">Cancelar</button>
      <button class="btn-danger" (click)="confirm.emit()">Eliminar</button>
    </div>
  </div>
</div>
