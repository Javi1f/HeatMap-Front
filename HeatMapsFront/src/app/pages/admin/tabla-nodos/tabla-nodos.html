@if (filas().length > 0) {
  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nodo</th>
          <th class="col-secondary">Zona</th>
          <th class="col-secondary">Última lectura</th>
          <th class="col-state">Estado</th>
        </tr>
      </thead>
      <tbody class="escalonado">
        @for (fila of filas(); track fila.idSensor) {
          <tr>
            <td>
              <div class="cell-flex">
                <span class="material-icons row-icon">memory</span>
                <span class="cell-strong">{{ fila.nombre }}</span>
              </div>
            </td>
            <td class="cell-muted col-secondary">{{ fila.zona }}</td>
            <td class="cell-muted col-secondary">{{ fila.ultimaLectura }}</td>
            <td class="cell-state">
              <!-- En línea, señal completa; sin señal, una barra: el nodo existe
                   pero no llega nada. -->
              <app-senal
                [barras]="fila.enLinea ? 4 : 1"
                [tono]="fila.enLinea ? 'ok' : 'aviso'"
                [texto]="fila.estado"
                [vivo]="fila.enLinea"
              />
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <div class="empty-state">
    <span class="material-icons">sensors_off</span>
    <p>No hay nodos registrados</p>
  </div>
}
