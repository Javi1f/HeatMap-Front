<div class="dashboard-container">

  <div class="dashboard-header">
    <h1 class="dashboard-title">
      <span class="material-icons">description</span>
      Reportes
    </h1>
    <p class="dashboard-subtitle">Consultas guardadas sobre el histórico de ocupación</p>
  </div>

  @if (error()) {
    <div class="alert alert-error">
      <span class="material-icons">error_outline</span>
      {{ error() }}
    </div>
  }

  <!-- ── Generar ────────────────────────────────────────────────────────── -->
  <section class="section-card">
    <div class="section-header">
      <div class="section-title-group">
        <span class="material-icons section-icon">add_chart</span>
        <div>
          <h2 class="section-title">Generar reporte</h2>
          <p class="section-desc">Se guarda la consulta, no el resultado: al reabrirla se recalcula</p>
        </div>
      </div>
    </div>

    <form class="form-grid" [formGroup]="form" (ngSubmit)="generar()">
      <label class="campo">
        <span class="campo-label">Tipo</span>
        <select class="campo-control" formControlName="tipoReporte">
          @for (tipo of tipos; track tipo[0]) {
            <option [value]="tipo[0]">{{ tipo[1] }}</option>
          }
        </select>
      </label>

      <label class="campo">
        <span class="campo-label">Desde</span>
        <input class="campo-control" type="date" formControlName="rangoInicio" />
      </label>

      <label class="campo">
        <span class="campo-label">Hasta</span>
        <input class="campo-control" type="date" formControlName="rangoFin" />
      </label>

      <label class="campo">
        <span class="campo-label">Zona</span>
        <select class="campo-control" formControlName="idZona">
          <option value="">Todas las zonas</option>
          @for (zona of zonas(); track zona.idZona) {
            <option [value]="zona.idZona">{{ zona.nombre }}</option>
          }
        </select>
      </label>

      <button class="btn-primary" type="submit" [disabled]="isGenerando()">
        @if (isGenerando()) {
          <div class="spinner spinner-sm"></div>
        } @else {
          <span class="material-icons">play_arrow</span>
          Generar
        }
      </button>
    </form>
  </section>

  <!-- ── Resultado ──────────────────────────────────────────────────────── -->
  @if (actual(); as reporte) {
    <app-resultado-reporte
      [reporte]="reporte"
      [descargando]="descargandoId() === reporte.idReporte"
      (descargar)="descargar($event)"
      (cerrar)="cerrar()"
    />
  }

  <!-- ── Guardados ──────────────────────────────────────────────────────── -->
  <app-reportes-guardados
    [guardados]="guardados()"
    [cargando]="isCargando()"
    [descargandoId]="descargandoId()"
    [eliminandoId]="eliminandoId()"
    (abrir)="abrir($event)"
    (descargar)="descargar($event)"
    (eliminar)="eliminar($event)"
  />
</div>
