<!-- El control de abrir vive fuera del <aside> porque en teléfono el aside sale
     de pantalla por completo; su propio botón se iría con él. -->
@if (!isMobileOpen()) {
  <button class="abrir-menu" (click)="toggleSidebar()" aria-label="Abrir menú de navegación">
    <span class="material-icons">menu</span>
  </button>
}

@if (isMobileOpen()) {
  <div class="mobile-overlay" (click)="toggleSidebar()"></div>
}

<aside
  [class.collapsed]="isCollapsed() && !isMobileOpen()"
  [class.mobile-open]="isMobileOpen()"
>

  <button class="toggle-btn" (click)="toggleSidebar()">
    <span class="material-icons">{{ iconoDelPliegue() }}</span>
  </button>

  <div class="sidebar-image">
    <img src="assets/logo.png" alt="logo" onerror="this.style.display='none'" />
  </div>

  <!-- Un único recorrido: las entradas de administración solo se diferencian
       por su clase, y esa marca viaja ya en el propio elemento. -->
  <nav class="nav-links">
    @for (item of entradas(); track item.route) {
      <a class="nav-item" [class.admin-item]="item.esAdmin" (click)="navigate(item.route)">
        <span class="material-icons">{{ item.icon }}</span>
        <span class="nav-label" [style.display]="mostrarEtiquetas() ? null : 'none'">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">

    <button class="theme-btn" (click)="toggleTheme()" [title]="tema().texto">
      <span class="material-icons">{{ tema().icono }}</span>
      <span [style.display]="mostrarEtiquetas() ? null : 'none'">{{ tema().texto }}</span>
    </button>

    @if (isLoggedIn()) {
      <div class="admin-info">
        <span class="material-icons">account_circle</span>
        <span class="admin-name" [style.display]="mostrarEtiquetas() ? null : 'none'">{{ currentAdmin()?.username }}</span>
      </div>
    }

    <!-- Iniciar y cerrar sesión son el mismo botón en dos estados; el
         componente decide cuál toca. -->
    <button [class]="accionSesion().clase" (click)="alPulsarSesion()">
      <span class="material-icons">{{ accionSesion().icono }}</span>
      <span [style.display]="mostrarEtiquetas() ? null : 'none'">{{ accionSesion().texto }}</span>
    </button>
  </div>

</aside>
